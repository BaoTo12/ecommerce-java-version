server:
  port: 8085
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB

spring:
  application:
    name: ecommerce-monolith
  lifecycle:
    timeout-per-shutdown-phase: 30s
  output:
    ansi:
      enabled: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ecommerce_user
    password: secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000         # 3 seconds — fail fast, don't hang users
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000  # Warn if connection held > 10 seconds
      connection-test-query: SELECT 1
      pool-name: EcommerceHikariPool
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false   # set true in dev to see query counts
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: T8527G5bvpx172miHv-Q5cDB8fs3cxW9AlmbifI5RKk-must-be-at-least-256-bits-long
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

  inventory:
    reservation-ttl-minutes: 30
    reservation-expiry-check-cron: "0 */5 * * * *"   # every 5 minutes

  retry:
    max-attempts: 3
    backoff-ms: 50

  rate-limit:
    order-create-per-minute: 10
    checkout-per-minute: 5
    login-per-minute: 20

  price:
    snapshot-tolerance-percent: 1.0   # allow ±1% price change

  payment:
    mock-success-rate: 0.9

  transaction:
    default-timeout-seconds: 30
    checkout-timeout-seconds: 10

logging:
  level:
    com.ecommerce: INFO
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.HikariPool: INFO
    org:
      hibernate:
        SQL: WARN
        stat: DEBUG
        orm:
          jdbc:
            bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

