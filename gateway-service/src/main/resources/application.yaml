server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── Auth Service (public — no token required) ──────────────────────────
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        # ── Order Service ──────────────────────────────────────────────────────
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/orders/**

        # ── Product Service ────────────────────────────────────────────────────
        - id: product-service
          uri: http://product-service:8083
          predicates:
            - Path=/products/**

        # ── User Service ───────────────────────────────────────────────────────
        - id: user-service
          uri: http://user-service:8084
          predicates:
            - Path=/users/**

      # Global CORS — adjust origins for production
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

# Must match the access secret in auth-service exactly
jwt:
  secret: ${JWT_SECRET:7d26344377958582321b9568122abb43c2e6d49c22c883402624780149488f61}
