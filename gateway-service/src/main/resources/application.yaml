server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── Auth & User Service (port 8085) ────────────────────────────────────
        - id: auth-service
          uri: http://user-service:8085
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://user-service:8085
          predicates:
            - Path=/users/**

        # ── Order Service (port 8081) ──────────────────────────────────────────
        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/orders/**, /cart/**, /checkout/**, /catalog/**

        # ── Inventory Service (port 8082) ──────────────────────────────────────
        - id: inventory-service
          uri: http://inventory-service:8082
          predicates:
            - Path=/inventory/**

      # Global CORS — adjust origins for production
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

# Must match the access secret in auth-service exactly
jwt:
  secret: ${JWT_SECRET:7d26344377958582321b9568122abb43c2e6d49c22c883402624780149488f61}
